<!DOCTYPE html>
<html>
<head>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        iframe {
            position: fixed;
            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            border: none;

            /* Fill 16:9 screens better */
            transform: scaleX(1.34);
            transform-origin: center center;

            /* Lower memory overhead */
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;

            image-rendering: auto;
        }
    </style>
</head>
<body>

    <iframe
        id="weather-frame"
        src="https://v2.weatherscan.net/?Manassas"
        loading="eager">
    </iframe>

    <script>
        const iframe = document.getElementById("weather-frame");

        function refreshWeatherScan() {
            console.log("Clearing iframe memory...");

            iframe.src = "about:blank";

            setTimeout(() => {
                iframe.src =
                    "https://v2.weatherscan.net/?Manassas#" +
                    Date.now();

                console.log("Memory cleared. Location preserved.");
            }, 2000);
        }

        /* Refresh every 2 hours */
        setInterval(refreshWeatherScan, 7200000);
    </script>

</body>
</html>
