<!DOCTYPE html>
<html>
<head>
    <style>
        html, body { 
            margin: 0; padding: 0; 
            width: 100vw; height: 100vh; 
            overflow: hidden; 
            background: #000 !important; 
            touch-action: none;
            -webkit-text-size-adjust: none;
        }

        /* CONTAINER TO ALIGN THE LOW-RES BOX */
        .responsive-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        iframe {
            /* TRICK INTERACTION SIZE */
            width: 1920px; 
            height: 1080px;
            border: none;
            
            /* CRUNCH FRAMING & APPLY WIDESCREEN STRETCH */
            zoom: 0.5;
            transform: scaleX(1.34);
            transform-origin: center;
            
            /* KEEP RENDER PERFORMANCE FAST */
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            image-rendering: -webkit-optimize-contrast;
            
            -webkit-transform-style: flat;
            transform-style: flat;
            will-change: auto;
            
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div class="responsive-container">
        <iframe id="weather-frame" src="https://v2.weatherscan.net/?Manassas"></iframe>
    </div>

    <script>
        /* REFRESH TO CLEAN MEMORY LEAKS ONCE AN HOUR */
        setInterval(function() {
            var iframe = document.getElementById('weather-frame');
            if (iframe) {
                var timestamp = new Date().getTime();
                iframe.src = "about:blank"; 
                
                setTimeout(function() {
                    iframe.src = "https://v2.weatherscan.net/?Manassas#" + timestamp;
                    console.log("Memory cleared. Location preserved.");
                }, 200);
            }
        }, 3600000); 
    </script>
</body>
</html>
