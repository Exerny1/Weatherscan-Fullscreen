<!DOCTYPE html>
<html>
<head>
    <style>
        html, body { 
            margin: 0; padding: 0; 
            width: 100vw; height: 100vh; 
            overflow: hidden; 
            background: #000 !important; 
            touch-action: none;
            -webkit-text-size-adjust: none;
        }

        /* THE LOW-QUALITY WRAPPER BOX */
        .responsive-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        iframe {
            /* FORCE A LOW INTERNAL RESOLUTION (960x540)
               The site inside now thinks it's running on a much smaller screen,
               which drastically cuts down asset rendering sizes and RAM consumption. */
            width: 960px; 
            height: 540px;
            border: none;
            
            /* BLOW UP THE LOW-RES IMAGE TO FILL THE SCREEN
               We combine your 1.34x widescreen stretch factor with the 2x scale 
               needed to bring 540p up to full screen size (960 * 2 = 1920). */
            transform: scale(2.68, 2.0); 
            transform-origin: center;
            
            /* Force the phone to use cheap, blocky pixel blending 
               instead of smooth, expensive anti-aliasing */
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            image-rendering: -webkit-optimize-contrast;
            
            -webkit-transform-style: flat;
            transform-style: flat;
            will-change: auto;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div class="responsive-container">
        <iframe id="weather-frame" src="https://v2.weatherscan.net/?Manassas"></iframe>
    </div>

    <script>
        // Flush the frame cache once an hour to keep the memory footprint low
        setInterval(function() {
            var iframe = document.getElementById('weather-frame');
            if (iframe) {
                var timestamp = new Date().getTime();
                iframe.src = "about:blank"; 
                setTimeout(function() {
                    iframe.src = "https://v2.weatherscan.net/?Manassas#" + timestamp;
                }, 200);
            }
        }, 3600000); 
    </script>
</body>
</html>
