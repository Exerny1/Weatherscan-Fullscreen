<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherscan Fullscreen</title>
    <style>
        /* Force zero margins, black background, and lock scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        .screen-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #weather-frame {
            position: absolute;
            /* Force the iframe base size to 4:3 dimensions relative to viewport height */
            height: 100vh;
            width: calc(100vh * (4 / 3));
            border: none;

            /* Stretch precisely from 4:3 to 16:9 widescreen */
            transform: scaleX(1.3333);
            transform-origin: center center;

            /* Performance & memory optimization */
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
    </style>
</head>
<body>

    <div class="screen-container">
        <iframe
            id="weather-frame"
            src="https://v2.weatherscan.net/?Manassas"
            loading="eager">
        </iframe>
    </div>

    <script>
        const iframe = document.getElementById("weather-frame");

        function refreshWeatherScan() {
            console.log("Clearing iframe memory...");
            iframe.src = "about:blank";

            setTimeout(() => {
                iframe.src = "https://v2.weatherscan.net/?Manassas#" + Date.now();
                console.log("Memory cleared. WeatherScan refreshed.");
            }, 2000);
        }

        /* Refresh every 30 minutes */
        setInterval(refreshWeatherScan, 1800000);
    </script>

</body>
</html>
