<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherscan Display</title>
    <style>
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            max-width: 100%;
            overflow: hidden;
            background: #000;
        }

        #weather-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            
            /* Lightweight settings */
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe
            id="weather-frame"
            src="https://v2.weatherscan.net/?Manassas"
            loading="eager">
        </iframe>
    </div>

    <script>
        const iframe = document.getElementById("weather-frame");

        function refreshWeatherScan() {
            console.log("Clearing iframe memory...");
            iframe.src = "about:blank";

            setTimeout(() => {
                iframe.src = "https://v2.weatherscan.net/?Manassas#" + Date.now();
                console.log("Memory cleared. WeatherScan refreshed.");
            }, 2000);
        }

        /* Refresh every 30 minutes */
        setInterval(refreshWeatherScan, 1800000);
    </script>

</body>
</html>
