<!DOCTYPE html>
<html>
<head>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        iframe {
            position: fixed;
            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            border: none;

            /* Stretch for widescreen displays */
            transform: scaleX(1.34);
            transform-origin: center center;

            /* Lightweight settings */
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;

            image-rendering: auto;
        }
    </style>
</head>
<body>

    <iframe
        id="weather-frame"
        src="https://v2.weatherscan.net/?Manassas">
    </iframe>

    <script>
        const iframe = document.getElementById("weather-frame");

        function refreshWeatherScan() {
            iframe.src =
                "https://v2.weatherscan.net/?Manassas#" +
                Date.now();

            console.log("WeatherScan refreshed.");
        }

        /* Refresh every 30 minutes */
        setInterval(refreshWeatherScan, 1800000);
    </script>

</body>
</html>
