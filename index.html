<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherscan Fullscreen</title>
    <style>
        /* Reset and lock body to fill the entire screen with no scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        .screen-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #weather-frame {
            width: 100%;
            height: 100%;
            border: none;

            /* Stretch 4:3 content to fill 16:9 / 17:9 widescreen displays */
            /* Adjust 1.33 to 1.4 if you want a wider/tighter stretch for 17:9 */
            transform: scaleX(1.34);
            transform-origin: center center;

            /* Lower memory overhead / hardware acceleration */
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
    </style>
</head>
<body>

    <div class="screen-container">
        <iframe
            id="weather-frame"
            src="https://v2.weatherscan.net/?Manassas"
            loading="eager">
        </iframe>
    </div>

    <script>
        const iframe = document.getElementById("weather-frame");

        function refreshWeatherScan() {
            console.log("Clearing iframe memory...");
            iframe.src = "about:blank";

            setTimeout(() => {
                iframe.src = "https://v2.weatherscan.net/?Manassas#" + Date.now();
                console.log("Memory cleared. WeatherScan refreshed.");
            }, 2000);
        }

        /* Refresh every 30 minutes */
        setInterval(refreshWeatherScan, 1800000);
    </script>

</body>
</html>
